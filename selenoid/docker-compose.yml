# Selenoid and the services around it.
#
# Ggr is the entry point for clients: the balancing rules live in
# ./ggr/quota/<user>.xml, and sessions are forwarded to the Selenoid nodes
# listed there. Selenoid itself is reachable inside the network only, as
# http://selenoid:4444 — this is what the tests and the Jenkins job use.
#
# Ggr UI reads the same quota directory and aggregates /status of all nodes,
# Selenoid UI points at it to show the whole cluster.
name: selenoid

services:
  selenoid:
    image: aerokube/selenoid:latest
    command:
      - -container-network
      - selenoid
      - -limit
      - "4"
    environment:
      DOCKER_API_VERSION: "1.40"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./browsers.json:/etc/selenoid/browsers.json:ro
    networks:
      - selenoid

  ggr:
    image: aerokube/ggr:latest-release
    volumes:
      - ./ggr:/etc/grid-router:ro
    ports:
      - "4444:4444"
    networks:
      - selenoid

  ggr-ui:
    image: aerokube/ggr-ui:latest-release
    volumes:
      - ./ggr/quota:/etc/grid-router/quota:ro
    ports:
      - "8888:8888"
    networks:
      - selenoid

  selenoid-ui:
    image: aerokube/selenoid-ui:1.10.11
    command:
      - --selenoid-uri
      - http://ggr-ui:8888
    ports:
      - "8090:8080"
    networks:
      - selenoid

networks:
  # Shared with the stand: the assignment expects the containers to live in an
  # external network named selenoid, the same one the tests and PrestaShop use.
  selenoid:
    external: true
