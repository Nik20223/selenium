# The whole stand in one command: Selenoid with its services, PrestaShop and the
# tests. Everything lands in the external network `selenoid`, so the browsers
# that Selenoid starts reach the shop by its container name.
services:
  selenoid:
    image: aerokube/selenoid:latest
    command:
      - -container-network
      - selenoid
      - -limit
      - "4"
    environment:
      DOCKER_API_VERSION: "1.40"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./selenoid/browsers.json:/etc/selenoid/browsers.json:ro
    networks:
      - selenoid

  ggr:
    image: aerokube/ggr:latest-release
    volumes:
      - ./selenoid/ggr:/etc/grid-router:ro
    ports:
      - "4444:4444"
    networks:
      - selenoid

  ggr-ui:
    image: aerokube/ggr-ui:latest-release
    volumes:
      - ./selenoid/ggr/quota:/etc/grid-router/quota:ro
    ports:
      - "8888:8888"
    networks:
      - selenoid

  selenoid-ui:
    image: aerokube/selenoid-ui:1.10.11
    command:
      - --selenoid-uri
      - http://ggr-ui:8888
    ports:
      - "8090:8080"
    networks:
      - selenoid

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: prestashop
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - selenoid

  prestashop:
    image: prestashop/prestashop:8.2.7
    depends_on:
      - db
    environment:
      DB_SERVER: db
      DB_NAME: prestashop
      DB_USER: root
      DB_PASSWD: admin
      DB_PREFIX: ps_
      PS_INSTALL_AUTO: 1
      PS_DEV_MODE: 0
      PS_DOMAIN: prestashop
      PS_LANGUAGE: en
      PS_COUNTRY: us
      PS_ENABLE_SSL: 0
      ADMIN_MAIL: admin@example.com
      ADMIN_PASSWD: Admin123!
      PS_FOLDER_ADMIN: administration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://prestashop"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s
    volumes:
      - ./pre-install:/tmp/pre-install-scripts:ro
      - ./init:/tmp/init-scripts:ro
    networks:
      - selenoid

  tests:
    build: .
    depends_on:
      prestashop:
        condition: service_healthy
    command:
      - --url
      - http://prestashop
      - --browser
      - chrome
      - --browser_version
      - "120.0"
      - --executor
      - selenoid
    volumes:
      - ./allure-results:/tests/allure-results
    networks:
      - selenoid

volumes:
  db_data:

networks:
  selenoid:
    external: true
