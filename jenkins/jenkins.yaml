# Applied by the configuration-as-code plugin on start, so the container needs
# no setup wizard, just the admin credentials below.
jenkins:
  systemMessage: "Стенд автотестов PrestaShop"
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: admin
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
